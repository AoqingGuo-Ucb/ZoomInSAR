[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-unwrapping"
version = "1.0.0"
description = "InSAR-only MCF phase unwrapping and closure correction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6", "rasterio>=1.3", "tqdm>=4.65"]
license = {text = "MIT"}
authors = [{name = "GuoAo"}]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
insar-unwrap = "insar_unwrapping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
