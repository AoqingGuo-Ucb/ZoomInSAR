[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-pixel-offset"
version = "0.1.0"
description = "NISAR GSLC pixel-offset tracking for ZoomInSAR"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "h5py>=3.8", "tqdm>=4.65"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
insar-pixel-offset = "insar_pixel_offset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
