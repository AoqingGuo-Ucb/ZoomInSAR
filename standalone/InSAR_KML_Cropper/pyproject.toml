[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-kml-cropper"
version = "1.0.0"
description = "Crop GAMMA-format InSAR rasters to an expanded KML bounding box"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.6", "tqdm>=4.65"]
license = {text = "MIT"}
authors = [{name = "GuoAo"}]

[project.scripts]
insar-kml-crop = "insar_kml_cropper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
